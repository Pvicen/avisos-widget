name: APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Preparar la firma
        env:
          CLAVE: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -eo pipefail
          if [ -f firma/avisos.jks.enc ] && [ -n "${CLAVE:-}" ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
              -pass env:CLAVE -in firma/avisos.jks.enc -out "$RUNNER_TEMP/avisos.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/avisos.jks" >> "$GITHUB_ENV"
          else
            echo "Sin llave de firma: se compila para revisar, pero no se publica."
          fi

      - name: Compilar
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: avisos
        run: gradle --no-daemon assembleRelease

      - name: Comprobar la firma
        if: env.KEYSTORE_FILE != ''
        run: |
          set -eo pipefail
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          if [ -z "$APK" ]; then echo "No se generó ningún APK"; exit 1; fi
          cp "$APK" avisos-widget.apk
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs avisos-widget.apk

      - name: Publicar el APK
        if: env.KEYSTORE_FILE != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eo pipefail
          gh release delete apk --yes --cleanup-tag || true
          sleep 5
          gh release create apk avisos-widget.apk \
            --title "Avisos Widget — última versión" \
            --notes "APK instalable del widget. Descárgalo desde el celular y ábrelo para instalar. Compilado desde el commit ${GITHUB_SHA}."

      - name: Guardar copia del APK
        if: env.KEYSTORE_FILE != ''
        uses: actions/upload-artifact@v4
        with:
          name: avisos-widget-apk
          path: avisos-widget.apk

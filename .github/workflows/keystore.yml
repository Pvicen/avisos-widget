name: Crear keystore de firma

# Se ejecuta UNA sola vez, a mano. Genera la llave con la que se firma el APK
# y la guarda cifrada en el repositorio (la contraseña vive solo en los secretos).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crear:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generar y cifrar la llave
        env:
          CLAVE: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -eo pipefail
          if [ -z "${CLAVE:-}" ]; then
            echo "Falta el secreto KEYSTORE_PASSWORD"
            exit 1
          fi
          if [ -f firma/avisos.jks.enc ]; then
            echo "La llave ya existe: no se toca."
            exit 0
          fi
          mkdir -p firma
          keytool -genkeypair -v \
            -keystore avisos.jks -alias avisos \
            -keyalg RSA -keysize 4096 -validity 10950 \
            -storepass "$CLAVE" -keypass "$CLAVE" \
            -dname "CN=Avisos Widget, OU=Personal, O=Pvicen, L=Santiago, ST=RM, C=CL"
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt \
            -pass env:CLAVE -in avisos.jks -out firma/avisos.jks.enc
          rm -f avisos.jks

      - name: Guardar en el repositorio
        run: |
          set -eo pipefail
          if [ -n "$(git status --porcelain firma)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add firma/avisos.jks.enc
            git commit -m "Llave de firma del APK (cifrada)"
            git push
          else
            echo "Nada que guardar."
          fi
